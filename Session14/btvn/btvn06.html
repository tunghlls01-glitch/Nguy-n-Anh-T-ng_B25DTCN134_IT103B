<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Danh sách Sản Phẩm Chợ Tết</h1>
    <input type="text" id="search-input" placeholder="Tìm sản phẩm...">
    <ul id="product-list">
        <!-- Danh Sách sản phẩm -->
    </ul>
    <form id="product-form">
        <input type="text" id="product-name" placeholder="Tên sản phẩm">
        <input type="text" id="product-price" placeholder="Giá (VND)">
        <button type="submit">Thêm Sản Phẩm</button>
    </form>
    <div>
        <button id="sortIncrease">Sắp xếp giá: Thấp - Cao</button>
        <button id="sortReduce">Sắp xếp giá: Cao - Thấp</button>
    </div>
    <script src="./btvn06.js"></script>
</body>
</html>
